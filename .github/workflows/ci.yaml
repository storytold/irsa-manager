name: CI
on:
  pull_request:
  push:
    branches:
      - "main"
jobs:
  test:
    name: Unit, Integration Test
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@v4.4.0
      - uses: actions/setup-go@v5.6.0
        with:
          go-version-file: go.mod
      - run: make test
